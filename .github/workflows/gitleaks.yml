# Secret scanning gate. See LAC-3163.
#
# Two jobs:
#   scan-diff         — blocks PRs. Scans commits introduced by the PR (or push
#                       to main) so a new secret never lands, regardless of the
#                       244 pre-existing hits in history.
#   scan-full-history — weekly + on demand. Reports full-history leak count so
#                       we can tell when the git filter-repo scrub has landed
#                       and the number drops to zero. Not blocking today; flip
#                       `continue-on-error` off after scrub + rotation.

name: gitleaks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-diff:
    name: Scan new commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history so gitleaks can walk the PR range or push delta.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Determine scan range
        id: range
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "log_opts=--no-merges ${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              echo "log_opts=-1 HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "log_opts=--no-merges ${BEFORE}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: gitleaks (delta)
        run: |
          gitleaks git \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --log-opts="${{ steps.range.outputs.log_opts }}"
      - name: Upload SARIF
        # Record-only. A leak already fails the "gitleaks (delta)" step above, so
        # this upload must never fail the required check on infra hiccups (e.g.
        # "Artifact storage quota has been hit"). See LAC-3321.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-diff-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 1

  scan-full-history:
    name: Scan full history (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (full history)
        run: |
          gitleaks git \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path gitleaks-history.sarif
      - name: Upload SARIF
        # Record-only; never fail on infra/quota hiccups. See LAC-3321.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif
          if-no-files-found: ignore
          retention-days: 7
